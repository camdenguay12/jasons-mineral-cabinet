<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jason's Mineral Cabinet</title><style>
:root{color-scheme:dark;--bg:#0e0c17;--panel:#1b1729;--line:#373044;--muted:#b6aeca;--accent:#b797ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#29203e,#0e0c17 65%);color:#f5f0ff;font:16px system-ui,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#110e1de8;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 22px;flex-wrap:wrap}.brand{font-family:Georgia,serif;font-size:21px;color:#fff;cursor:pointer}nav .links{display:flex;gap:8px;flex-wrap:wrap}.links button,.secondary{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 14px;border-radius:10px}.links button.active,.links button:hover,.secondary:hover{background:#38284e;color:#fff}main{max-width:1200px;margin:auto;padding:30px 22px 90px}.hero{text-align:center;padding:70px 12px 55px}.eyebrow{letter-spacing:3px;text-transform:uppercase;color:#c8a9ff;font-size:12px;font-weight:700}h1{font-family:Georgia,serif;font-size:clamp(40px,7vw,78px);line-height:1.08;margin:14px 0 18px}h2{font-family:Georgia,serif;font-size:32px;margin:16px 0}p{color:var(--muted);line-height:1.65}.hero p{max-width:620px;margin:0 auto 30px}.search{display:block;width:min(100%,650px);margin:22px auto;padding:17px 20px;border:1px solid #625075;border-radius:16px;background:#21192e;color:white;outline:none}.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:20px}.card{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--panel);cursor:pointer;transition:transform .2s,border-color .2s}.card:hover{transform:translateY(-4px);border-color:var(--accent)}.visual{height:205px;display:grid;place-items:center;background:linear-gradient(140deg,#39294f,#161420);color:#b6a2d6;font-size:52px}.card .body{padding:17px}.card h3{margin:0 0 5px}.card p{margin:0;font-size:13px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:25px 0}.pill{display:inline-block;border:1px solid #5b4774;color:#cfb7ff;border-radius:30px;padding:5px 10px;font-size:12px}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:20px 0 30px}input,select,textarea{width:100%;padding:12px;border:1px solid #4b3d5c;border-radius:10px;background:#1b1729;color:white}label{display:block;font-size:13px;color:#c9bfd9;margin-bottom:7px}.field{margin-bottom:16px}.panel{background:#1b1729;border:1px solid var(--line);border-radius:18px;padding:25px}.empty{text-align:center;padding:65px 20px;border:1px dashed #635375;border-radius:18px;color:var(--muted)}.primary{border:0;border-radius:11px;background:#a47be9;color:#150d22;padding:13px 20px;font-weight:750}.primary:hover{background:#c0a0fa}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}.notice{background:#342741;border:1px solid #6b5284;border-radius:12px;padding:14px 18px;color:#d9c7f1;margin:20px 0}.photo{width:100%;height:205px;object-fit:cover}footer{text-align:center;color:#82758e;padding:30px;border-top:1px solid var(--line)}@media(max-width:600px){nav{justify-content:center}.brand{width:100%;text-align:center}.links{justify-content:center}.links button{padding:8px}.hero{padding:38px 0}main{padding:20px 15px 65px}}
</style></head><body><header><nav><div class="brand" onclick="go('home')">✧ Jason's Mineral Cabinet</div><div class="links"><button data-page="home" onclick="go('home')">Home</button><button data-page="collection" onclick="go('collection')">Collection</button><button data-page="gallery" onclick="go('gallery')">Gallery</button><button data-page="add" onclick="go('add')">Add Specimen</button></div></nav></header><main id="app"></main><footer>Jason's Mineral Cabinet · A personal collection of Earth's natural wonders</footer><script>
const families=['Silicates','Carbonates','Oxides','Sulfides','Sulfates','Halides','Phosphates','Native Elements','Other Minerals'];const symbols=['◇','⬡','✦','◆','◈','❖','✧','⬢','✳'];const fields=[['name','Mineral species / name','text'],['title','Display title','text'],['description','Description','textarea'],['family','Mineral family','family'],['variety','Variety','text'],['associated','Associated minerals','text'],['locality','Locality','text'],['height','Height (mm)','number'],['width','Width (mm)','number'],['depth','Depth (mm)','number'],['weight','Weight (g)','number'],['price','Acquisition price (private)','number'],['formula','Chemical formula','text'],['uv','UV reactivity / phosphorescence','text'],['hardness','Mohs hardness','number'],['crystal','Crystal system','crystal']];let specimens=[],page='home',query='',filters={};const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const placeholder=(i=0)=>'<div class="visual">'+symbols[i%symbols.length]+'</div>';const img=(s,i=0)=>s.images?.[0]?'<img class="photo" src="'+esc(s.images[0])+'" alt="'+esc(s.name)+'">':placeholder(i);function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();else if(page==='collection')collection();else if(page==='gallery')gallery();else if(page==='add')add();else if(page.startsWith('specimen/'))detail(page.split('/')[1]);else go('home')}function home(){app.innerHTML='<section class="hero"><div class="eyebrow">A collection of natural wonders</div><h1>Jason’s Mineral<br>Cabinet</h1><p>Explore a personal catalog of minerals and geological treasures, organized by mineral family, locality, and the unique beauty of each specimen.</p><input class="search" id="homeSearch" placeholder="Search minerals, varieties, or localities…" aria-label="Search collection"><button class="primary" onclick="searchHome()">Explore the collection →</button></section><div class="section-head"><h2>Explore by mineral family</h2><span class="pill">'+specimens.length+' specimens cataloged</span></div><div class="grid">'+families.map((f,i)=>{let items=specimens.filter(s=>s.family===f),cover=items.length?items[Math.floor(Math.random()*items.length)]:null;return '<article class="card" onclick="filters.family=\''+f+'\';go(\'collection\')">'+(cover?img(cover,i):placeholder(i))+'<div class="body"><h3>'+f+'</h3><p>'+items.length+' specimens</p></div></article>'}).join('')+'</div>'}function searchHome(){query=document.getElementById('homeSearch').value;filters={};go('collection')}function filtered(){let q=query.toLowerCase();return specimens.filter(s=>(!q||[s.name,s.title,s.variety,s.locality,s.family].some(v=>String(v||'').toLowerCase().includes(q)))&&(!filters.family||s.family===filters.family)&&(!filters.uv||String(s.uv||'').toLowerCase().includes(filters.uv.toLowerCase()))&&(!filters.locality||String(s.locality||'').toLowerCase().includes(filters.locality.toLowerCase()))&&(!filters.variety||String(s.variety||'').toLowerCase().includes(filters.variety.toLowerCase()))&&(!filters.minWeight||Number(s.weight)>=Number(filters.minWeight))&&(!filters.maxWeight||Number(s.weight)<=Number(filters.maxWeight)))}function collection(){let arr=filtered();app.innerHTML='<div class="section-head"><div><div class="eyebrow">The catalog</div><h1 style="font-size:48px">The Collection</h1><p>Search, discover, and explore every specimen.</p></div><span class="pill">'+arr.length+' specimens</span></div><div class="filters"><div><label>Search</label><input id="q" value="'+esc(query)+'" placeholder="Name, variety, locality"></div><div><label>Mineral family</label><select id="family"><option value="">All families</option>'+families.map(f=>'<option '+(filters.family===f?'selected':'')+'>'+f+'</option>').join('')+'</select></div><div><label>Locality</label><input id="locality" value="'+esc(filters.locality||'')+'" placeholder="Any locality"></div><div><label>Variety</label><input id="variety" value="'+esc(filters.variety||'')+'" placeholder="Any variety"></div><div><label>UV reaction</label><input id="uv" value="'+esc(filters.uv||'')+'" placeholder="Any"></div><div><label>Min weight (g)</label><input type="number" id="minWeight" value="'+esc(filters.minWeight||'')+'"></div><div><label>Max weight (g)</label><input type="number" id="maxWeight" value="'+esc(filters.maxWeight||'')+'"></div><div><label>Sort by</label><select id="sort"><option value="name">Name A–Z</option><option value="weightDown">Weight high–low</option><option value="weightUp">Weight low–high</option><option value="hardnessDown">Hardness high–low</option><option value="hardnessUp">Hardness low–high</option><option value="locality">Locality</option><option value="recent">Recently added</option></select></div></div><div style="margin-bottom:20px"><button class="secondary" onclick="query=\'\';filters={};go(\'collection\')">Clear all filters</button></div><div id="results"></div>';['q','family','locality','variety','uv','minWeight','maxWeight','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',()=>{query=document.getElementById('q').value;['family','locality','variety','uv','minWeight','maxWeight'].forEach(k=>filters[k]=document.getElementById(k).value);drawResults()}));drawResults()}function drawResults(){let a=filtered(),sort=document.getElementById('sort').value;a.sort((x,y)=>sort==='recent'?String(y.id).localeCompare(String(x.id)):sort==='locality'?String(x.locality||'').localeCompare(String(y.locality||'')):sort==='name'?String(x.name||'').localeCompare(String(y.name||'')):(()=>{let k=sort.startsWith('weight')?'weight':'hardness',dir=sort.endsWith('Down')?-1:1;return (x[k]==null)-(y[k]==null)||dir*(Number(x[k]||0)-Number(y[k]||0))})());document.getElementById('results').innerHTML=a.length?'<div class="grid">'+a.map((s,i)=>'<article class="card" onclick="go(\'specimen/'+esc(s.id)+'\')">'+img(s,i)+'<div class="body"><span class="pill">'+esc(s.family||'Unclassified')+'</span><h3 style="margin-top:12px">'+esc(s.title||s.name)+'</h3><p>'+esc(s.variety||'')+'</p><p>'+esc(s.locality||'Locality not recorded')+'</p></div></article>').join('')+'</div>':'<div class="empty"><h2>No specimens found</h2><p>The catalog is ready for its first records, or try clearing your filters.</p></div>'}function gallery(){let photos=specimens.flatMap(s=>(s.images||[]).map(url=>({s,url})));app.innerHTML='<div class="eyebrow">Through the lens</div><h1 style="font-size:52px">Specimen Gallery</h1><p>Every photograph in the collection, all in one place.</p>'+(photos.length?'<div class="grid">'+photos.map(o=>'<article class="card" onclick="go(\'specimen/'+esc(o.s.id)+'\')"><img class="photo" src="'+esc(o.url)+'" alt="'+esc(o.s.name)+'"><div class="body">'+esc(o.s.name)+'</div></article>').join('')+'</div>':'<div class="empty"><h2>Photography coming soon</h2><p>Specimen photographs will appear here as they are added to the collection.</p></div>')}function add(){app.innerHTML='<div class="eyebrow">Collection management</div><h1 style="font-size:52px">Add Specimen</h1><div class="notice"><strong>Administrator setup required.</strong> This public GitHub Pages site cannot securely save specimens or photographs on its own. A private database, image storage, and administrator login must be connected before submission is enabled. No acquisition prices will be published.</div><div class="panel"><form id="specimenForm"><div class="formgrid">'+fields.map(([id,label,type])=>'<div class="field"><label for="'+id+'">'+label+'</label>'+(type==='textarea'?'<textarea id="'+id+'" rows="3"></textarea>':type==='family'?'<select id="'+id+'"><option value="">Select family</option>'+families.map(f=>'<option>'+f+'</option>').join('')+'</select>':type==='crystal'?'<select id="'+id+'"><option value="">Not recorded</option>'+['Cubic','Tetragonal','Orthorhombic','Hexagonal','Trigonal','Monoclinic','Triclinic'].map(f=>'<option>'+f+'</option>').join('')+'</select>':'<input id="'+id+'" type="'+type+'" '+(type==='number'?'step="any" min="0"':'')+'>')+'</div>').join('')+'</div><div class="field"><label>Specimen photographs (multiple)</label><input type="file" accept="image/*" multiple disabled><p>Photo upload becomes available after secure storage is configured.</p></div><button type="button" class="primary" disabled title="Backend setup required">Save specimen — setup required</button><button type="button" class="secondary" onclick="go(\'home\')">Cancel</button></form></div>'}function detail(id){let s=specimens.find(x=>x.id===id);if(!s){go('collection');return}app.innerHTML='<button class="secondary" onclick="go(\'collection\')">← Back to collection</button><div class="eyebrow" style="margin-top:24px">'+esc(s.family||'Specimen')+'</div><h1 style="font-size:52px">'+esc(s.title||s.name)+'</h1><p>'+esc(s.locality||'Locality not recorded')+'</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div>'+img(s)+'</div><div class="panel"><h2>Specimen details</h2>'+fields.filter(([k])=>k!=='price').map(([k,l])=>'<p><strong>'+l+':</strong> '+esc(s[k]||'Not recorded')+'</p>').join('')+'</div></div>'}window.addEventListener('hashchange',()=>{page=decodeURIComponent(location.hash.slice(1)||'home');render()});page=decodeURIComponent(location.hash.slice(1)||'home');render();
</script></body></html>
