<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jason's Mineral Cabinet</title><style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--bg:#09090d;--panel:#131219;--line:#2b2735;--muted:#aaa5b7;--accent:#a78bfa;--accent-soft:#c4b5fd;--text:#f4f1f8}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:radial-gradient(ellipse at 50% -18%,#21182f 0%,#101016 38%,var(--bg) 74%);color:var(--text);font:15px 'Manrope',system-ui,sans-serif;letter-spacing:.01em}
button,input,select,textarea{font:inherit}button{cursor:pointer}
header{position:sticky;top:0;z-index:5;background:rgba(10,9,15,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(167,139,250,.16)}
nav{max-width:1200px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;flex-wrap:wrap}
.brand{font-family:'Cormorant Garamond',Georgia,serif;font-size:27px;font-weight:600;letter-spacing:.015em;color:#f8f5ff;cursor:pointer}
nav .links{display:flex;gap:5px;flex-wrap:wrap}.links button,.secondary{border:1px solid transparent;background:transparent;color:var(--muted);padding:10px 14px;border-radius:9px;transition:background .2s,color .2s,border-color .2s}
.links button.active,.links button:hover,.secondary:hover{background:#211a2d;color:#f5efff;border-color:#3c304e}
main{max-width:1200px;margin:auto;padding:30px 22px 90px}.hero{text-align:center;padding:94px 12px 72px}
.eyebrow{letter-spacing:3.4px;text-transform:uppercase;color:var(--accent-soft);font-size:10px;font-weight:800}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;letter-spacing:-.025em}
h1{font-size:clamp(54px,8vw,92px);line-height:.94;margin:22px 0 24px}h2{font-size:36px;line-height:1.1;margin:16px 0}h3{font-weight:650;letter-spacing:-.025em}
p{color:var(--muted);line-height:1.8}.hero p{max-width:610px;margin:0 auto 32px;font-size:15px}
.search{display:block;width:min(100%,650px);margin:25px auto;padding:17px 20px;border:1px solid #393044;border-radius:12px;background:rgba(20,18,27,.9);color:white;outline:none}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px rgba(167,139,250,.1)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(225px,1fr));gap:20px}
.card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:linear-gradient(155deg,#17151e,#111016);cursor:pointer;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:hover{transform:translateY(-4px);border-color:#6d5790;box-shadow:0 12px 32px #0005}
.visual{height:205px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 35%,#30243f,#17141e 72%);color:#b8a2e8;font-size:52px}
.card .body{padding:19px}.card h3{margin:0 0 7px;font-size:16px}.card p{margin:0;font-size:12px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin:25px 0}
.pill{display:inline-block;border:1px solid #514064;color:#c4b5fd;border-radius:30px;padding:5px 10px;font-size:11px;letter-spacing:.02em}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px;margin:20px 0 30px}
input,select,textarea{width:100%;padding:12px;border:1px solid #393342;border-radius:9px;background:#15131b;color:white}
label{display:block;font-size:12px;color:#c9c2d5;margin-bottom:8px}.field{margin-bottom:16px}
.panel{background:#131219;border:1px solid var(--line);border-radius:14px;padding:25px}
.empty{text-align:center;padding:65px 20px;border:1px dashed #51445f;border-radius:14px;color:var(--muted)}
.photo{width:100%;height:205px;object-fit:cover}
.primary{border:1px solid #b7a0f7;border-radius:9px;background:#b7a0f7;color:#171020;padding:13px 21px;font-weight:800;transition:background .2s,transform .2s}
.primary:hover{background:#d0c0ff;transform:translateY(-1px)}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:0 18px}
.notice{background:#1d1726;border:1px solid #514064;border-radius:11px;padding:14px 18px;color:#d9c7f1;margin:20px 0}
footer{text-align:center;color:#777182;padding:30px;border-top:1px solid #24212d;font-size:12px;letter-spacing:.04em}
@media(max-width:600px){nav{justify-content:center}.brand{width:100%;text-align:center;font-size:28px}.links{justify-content:center}.links button{padding:8px}.hero{padding:58px 0 44px}h1{font-size:clamp(52px,15vw,72px)}main{padding:20px 15px 65px}}
</style></head><body><header><nav><div class="brand" onclick="go('home')">✧ Jason's Mineral Cabinet</div><div class="links"><button data-page="home" onclick="go('home')">Home</button><button data-page="collection" onclick="go('collection')">Collection</button><button data-page="gallery" onclick="go('gallery')">Gallery</button><button data-page="add" onclick="go('add')">Add Specimen</button></div></nav></header><main id="app"></main><footer>Jason's Mineral Cabinet · A personal collection of Earth's natural wonders</footer><script>
const families=['Silicates','Carbonates','Oxides','Sulfides','Sulfates','Halides','Phosphates','Native Elements','Other Minerals'];const symbols=['◇','⬡','✦','◆','◈','❖','✧','⬢','✳'];const fields=[['name','Mineral species / name','text'],['title','Display title','text'],['description','Description','textarea'],['family','Mineral family','family'],['variety','Variety','text'],['associated','Associated minerals','text'],['locality','Locality','text'],['height','Height (mm)','number'],['width','Width (mm)','number'],['depth','Depth (mm)','number'],['weight','Weight (g)','number'],['price','Acquisition price (private)','number'],['formula','Chemical formula','text'],['uv','UV reactivity / phosphorescence','text'],['hardness','Mohs hardness','number'],['crystal','Crystal system','crystal']];let specimens=[],page='home',query='',filters={};const app=document.getElementById('app');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const placeholder=(i=0)=>'<div class="visual">'+symbols[i%symbols.length]+'</div>';const img=(s,i=0)=>s.images?.[0]?'<img class="photo" src="'+esc(s.images[0])+'" alt="'+esc(s.name)+'">':placeholder(i);function go(p){page=p;location.hash=p;render();window.scrollTo(0,0)}function render(){document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='home')home();else if(page==='collection')collection();else if(page==='gallery')gallery();else if(page==='add')add();else if(page.startsWith('specimen/'))detail(page.split('/')[1]);else go('home')}function home(){app.innerHTML='<section class="hero"><div class="eyebrow">A collection of natural wonders</div><h1>Jason’s Mineral<br>Cabinet</h1><p>Explore a personal catalog of minerals and geological treasures, organized by mineral family, locality, and the unique beauty of each specimen.</p><input class="search" id="homeSearch" placeholder="Search minerals, varieties, or localities…" aria-label="Search collection"><button class="primary" onclick="searchHome()">Explore the collection →</button></section><div class="section-head"><h2>Explore by mineral family</h2><span class="pill">'+specimens.length+' specimens cataloged</span></div><div class="grid">'+families.map((f,i)=>{let items=specimens.filter(s=>s.family===f),cover=items.length?items[Math.floor(Math.random()*items.length)]:null;return '<article class="card" onclick="filters.family=\''+f+'\';go(\'collection\')">'+(cover?img(cover,i):placeholder(i))+'<div class="body"><h3>'+f+'</h3><p>'+items.length+' specimens</p></div></article>'}).join('')+'</div>'}function searchHome(){query=document.getElementById('homeSearch').value;filters={};go('collection')}function filtered(){let q=query.toLowerCase();return specimens.filter(s=>(!q||[s.name,s.title,s.variety,s.locality,s.family].some(v=>String(v||'').toLowerCase().includes(q)))&&(!filters.family||s.family===filters.family)&&(!filters.uv||String(s.uv||'').toLowerCase().includes(filters.uv.toLowerCase()))&&(!filters.locality||String(s.locality||'').toLowerCase().includes(filters.locality.toLowerCase()))&&(!filters.variety||String(s.variety||'').toLowerCase().includes(filters.variety.toLowerCase()))&&(!filters.minWeight||parseFloat(s.weight)>=Number(filters.minWeight))&&(!filters.maxWeight||parseFloat(s.weight)<=Number(filters.maxWeight)))}function collection(){let arr=filtered();app.innerHTML='<div class="section-head"><div><div class="eyebrow">The catalog</div><h1 style="font-size:48px">The Collection</h1><p>Search, discover, and explore every specimen.</p></div><span class="pill">'+arr.length+' specimens</span></div><div class="filters"><div><label>Search</label><input id="q" value="'+esc(query)+'" placeholder="Name, variety, locality"></div><div><label>Mineral family</label><select id="family"><option value="">All families</option>'+families.map(f=>'<option '+(filters.family===f?'selected':'')+'>'+f+'</option>').join('')+'</select></div><div><label>Locality</label><input id="locality" value="'+esc(filters.locality||'')+'" placeholder="Any locality"></div><div><label>Variety</label><input id="variety" value="'+esc(filters.variety||'')+'" placeholder="Any variety"></div><div><label>UV reaction</label><input id="uv" value="'+esc(filters.uv||'')+'" placeholder="Any"></div><div><label>Min weight (g)</label><input type="number" id="minWeight" value="'+esc(filters.minWeight||'')+'"></div><div><label>Max weight (g)</label><input type="number" id="maxWeight" value="'+esc(filters.maxWeight||'')+'"></div><div><label>Sort by</label><select id="sort"><option value="name">Name A–Z</option><option value="weightDown">Weight high–low</option><option value="weightUp">Weight low–high</option><option value="hardnessDown">Hardness high–low</option><option value="hardnessUp">Hardness low–high</option><option value="locality">Locality</option><option value="recent">Recently added</option></select></div></div><div style="margin-bottom:20px"><button class="secondary" onclick="query=\'\';filters={};go(\'collection\')">Clear all filters</button></div><div id="results"></div>';['q','family','locality','variety','uv','minWeight','maxWeight','sort'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',()=>{query=document.getElementById('q').value;['family','locality','variety','uv','minWeight','maxWeight'].forEach(k=>filters[k]=document.getElementById(k).value);drawResults()}));drawResults()}function drawResults(){let a=filtered(),sort=document.getElementById('sort').value;a.sort((x,y)=>sort==='recent'?String(y.id).localeCompare(String(x.id)):sort==='locality'?String(x.locality||'').localeCompare(String(y.locality||'')):sort==='name'?String(x.name||'').localeCompare(String(y.name||'')):(()=>{let k=sort.startsWith('weight')?'weight':'hardness',dir=sort.endsWith('Down')?-1:1;return (x[k]==null)-(y[k]==null)||dir*(parseFloat(x[k]||0)-parseFloat(y[k]||0))})());document.getElementById('results').innerHTML=a.length?'<div class="grid">'+a.map((s,i)=>'<article class="card" onclick="go(\'specimen/'+esc(s.id)+'\')">'+img(s,i)+'<div class="body"><span class="pill">'+esc(s.family||'Unclassified')+'</span><h3 style="margin-top:12px">'+esc(s.title||s.name)+'</h3><p>'+esc(s.locality||'Locality not recorded')+'</p></div></article>').join('')+'</div>':'<div class="empty"><h2>No specimens found</h2><p>The catalog is ready for its first records, or try clearing your filters.</p></div>'}function gallery(){let photos=specimens.flatMap(s=>(s.images||[]).map(url=>({s,url})));app.innerHTML='<div class="eyebrow">Through the lens</div><h1 style="font-size:52px">Specimen Gallery</h1><p>Every photograph in the collection, all in one place.</p>'+(photos.length?'<div class="grid">'+photos.map(o=>'<article class="card" onclick="go(\'specimen/'+esc(o.s.id)+'\')"><img class="photo" src="'+esc(o.url)+'" alt="'+esc(o.s.name)+'"><div class="body">'+esc(o.s.name)+'</div></article>').join('')+'</div>':'<div class="empty"><h2>Photography coming soon</h2><p>Specimen photographs will appear here as they are added to the collection.</p></div>')}function add(){app.innerHTML='<div class="eyebrow">Collection management</div><h1 style="font-size:52px">Add Specimen</h1><div class="notice"><strong>Administrator setup required.</strong> This public GitHub Pages site cannot securely save specimens or photographs on its own. A private database, image storage, and administrator login must be connected before submission is enabled. No acquisition prices will be published.</div><div class="panel"><form id="specimenForm"><div class="formgrid">'+fields.map(([id,label,type])=>'<div class="field"><label for="'+id+'">'+label+'</label>'+(type==='textarea'?'<textarea id="'+id+'" rows="3"></textarea>':type==='family'?'<select id="'+id+'"><option value="">Select family</option>'+families.map(f=>'<option>'+f+'</option>').join('')+'</select>':type==='crystal'?'<select id="'+id+'"><option value="">Not recorded</option>'+['Cubic','Tetragonal','Orthorhombic','Hexagonal','Trigonal','Monoclinic','Triclinic'].map(f=>'<option>'+f+'</option>').join('')+'</select>':'<input id="'+id+'" type="'+type+'" '+(type==='number'?'step="any" min="0"':'')+'>')+'</div>').join('')+'</div><div class="field"><label>Specimen photographs (multiple)</label><input type="file" accept="image/*" multiple disabled><p>Photo upload becomes available after secure storage is configured.</p></div><button type="button" class="primary" disabled title="Backend setup required">Save specimen — setup required</button><button type="button" class="secondary" onclick="go(\'home\')">Cancel</button></form></div>'}function detail(id){let s=specimens.find(x=>x.id===id);if(!s){go('collection');return}app.innerHTML='<button class="secondary" onclick="go(\'collection\')">← Back to collection</button><div class="eyebrow" style="margin-top:24px">'+esc(s.family||'Specimen')+'</div><h1 style="font-size:52px">'+esc(s.title||s.name)+'</h1><p>'+esc(s.locality||'Locality not recorded')+'</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(280px,1fr))"><div>'+img(s)+'</div><div class="panel"><h2>Specimen details</h2>'+[['name','Mineral species'],['description','Description'],['family','Mineral family'],['variety','Variety'],['associated','Associated minerals'],['locality','Locality'],['dimensions','Dimensions'],['weight','Weight'],['formula','Chemical formula'],['uv','UV reactivity'],['hardness','Mohs hardness'],['crystal','Crystal system']].map(([k,l])=>'<p><strong>'+l+':</strong> '+esc(s[k]||'Not recorded')+'</p>').join('')+'</div></div>'}window.addEventListener('hashchange',()=>{page=decodeURIComponent(location.hash.slice(1)||'home');render()});page=decodeURIComponent(location.hash.slice(1)||'home');fetch('specimens.json').then(r=>{if(!r.ok)throw Error('Unable to load catalog');return r.json()}).then(rows=>{specimens=rows;render()}).catch(e=>{console.error(e);render()});render();
</script></body></html>
